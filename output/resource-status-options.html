<div id="oxi-resource-options">
  <style>
    #oxi-resource-options .stage { min-height: 340px; display: grid; align-items: center; padding: 16px; }
    #oxi-resource-options .product {
      --oxi-bg: light-dark(#fafbfc, #101418);
      --oxi-fg: light-dark(#26333c, #e0e8ed);
      --oxi-muted: light-dark(#60707d, #96a7b3);
      --oxi-line: light-dark(#dce3e8, #2a353d);
      --oxi-track: light-dark(#e0e7eb, #26333b);
      --oxi-accent: light-dark(#087f82, #43d1c6);
      --oxi-panel: light-dark(#ffffff, #1b242b);
      background: var(--oxi-bg); color: var(--oxi-fg);
      border: 1px solid var(--oxi-line); border-radius: 10px;
      width: 100%; position: relative; overflow: visible;
      font: 13px/1.5 ui-monospace, "Cascadia Code", monospace;
      box-sizing: border-box;
    }
    #oxi-resource-options .product * { box-sizing: border-box; }
    #oxi-resource-options .window-label {
      display: flex; align-items: center; gap: 8px; padding: 9px 14px;
      border-bottom: 1px solid var(--oxi-line); color: var(--oxi-muted);
    }
    #oxi-resource-options .window-label svg { width: 15px; height: 15px; }
    #oxi-resource-options .terminal { height: 192px; padding: 18px; color: var(--oxi-muted); }
    #oxi-resource-options .prompt { color: var(--oxi-accent); }
    #oxi-resource-options .footer {
      min-height: 44px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: flex-end; gap: 18px; padding: 8px 14px;
      border-top: 1px solid var(--oxi-line); border-radius: 0 0 10px 10px;
      background: var(--oxi-bg); font-variant-numeric: tabular-nums;
    }
    #oxi-resource-options .metric { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    #oxi-resource-options .metric-label { color: var(--oxi-muted); }
    #oxi-resource-options .value { color: var(--oxi-fg); font-weight: 500; }
    #oxi-resource-options .capacity { color: var(--oxi-muted); font-size: 11px; }
    #oxi-resource-options .mini-history { display: block; width: 82px; height: 24px; overflow: visible; }
    #oxi-resource-options .history-line { fill: none; stroke: var(--oxi-accent); stroke-width: 1.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
    #oxi-resource-options .history-area { fill: var(--oxi-accent); opacity: .1; }
    #oxi-resource-options .history-end { fill: var(--oxi-accent); }
    #oxi-resource-options .track { background: var(--oxi-track); height: 5px; width: 64px; border-radius: 3px; overflow: hidden; }
    #oxi-resource-options .fill { background: var(--oxi-accent); height: 100%; border-radius: inherit; }
    #oxi-resource-options .segmented { display: flex; align-items: flex-end; gap: 3px; height: 17px; }
    #oxi-resource-options .segment { width: 5px; height: 12px; border-radius: 1px; background: var(--oxi-track); }
    #oxi-resource-options .segment.on { background: var(--oxi-accent); }
    #oxi-resource-options .meter-group { display: grid; gap: 4px; }
    #oxi-resource-options .meter-readout { display: flex; align-items: baseline; justify-content: space-between; gap: 9px; }
    #oxi-resource-options .meter-footer { gap: 26px; }
    #oxi-resource-options .product-button {
      display: inline-flex; align-items: center; gap: 8px; border: 0;
      font: inherit; color: var(--oxi-fg); background: transparent;
      padding: 2px 0; border-radius: 4px;
    }
    #oxi-resource-options .product-button:hover { background: var(--oxi-track); }
    #oxi-resource-options .product-button svg { width: 15px; height: 15px; color: var(--oxi-accent); }
    #oxi-resource-options .divider { color: var(--oxi-line); }
    #oxi-resource-options .detail {
      position: absolute; z-index: 2; right: 10px; bottom: 51px;
      width: min(350px, calc(100% - 20px)); padding: 16px;
      background: var(--oxi-panel); border: 1px solid var(--oxi-line);
      border-radius: 10px; box-shadow: 0 8px 22px light-dark(#172d3b18, #00000040);
    }
    #oxi-resource-options .detail[hidden] { display: none; }
    #oxi-resource-options .detail-heading { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 12px; }
    #oxi-resource-options .detail-heading strong { font-weight: 500; }
    #oxi-resource-options .detail-time { color: var(--oxi-muted); font-size: 11px; white-space: nowrap; }
    #oxi-resource-options .chart-label { display: flex; justify-content: space-between; align-items: baseline; }
    #oxi-resource-options .detail-chart { display: block; width: 100%; height: 42px; margin: 5px 0 10px; }
    #oxi-resource-options .chart-grid { stroke: var(--oxi-line); stroke-width: 1; }
    #oxi-resource-options .chart-axis { display: flex; justify-content: space-between; color: var(--oxi-muted); font-size: 11px; }
    #oxi-resource-options .detail .capacity { font-size: 12px; }
    #oxi-resource-options .icon-metric { width: 14px; height: 14px; color: var(--oxi-muted); }
    @media (max-width: 490px) {
      #oxi-resource-options .stage { padding: 8px; min-height: 365px; }
      #oxi-resource-options .footer { gap: 10px 16px; padding: 9px 12px; }
      #oxi-resource-options .mini-history { width: 58px !important; }
      #oxi-resource-options .terminal { height: 210px; }
      #oxi-resource-options .trend-memory .capacity { display: none; }
      #oxi-resource-options .compact-capacity { display: none; }
    }
  </style>
  <div class="viz-carousel viz-dotted-background" aria-label="CPU and memory status bar designs">
    <section data-variant="Trend strip" aria-label="Trend strip design">
      <div class="stage">
        <div class="product" id="oxi-trend" aria-label="Trend strip">
          <div class="window-label"><i data-lucide="terminal" aria-hidden="true"></i>oxishell</div>
          <div class="terminal"><span class="prompt">~ $</span> ▏</div>
          <div class="footer">
            <div class="metric">
              <span class="metric-label">CPU</span>
              <svg class="mini-history" viewBox="0 0 120 26" preserveAspectRatio="none" role="img" aria-label="Illustrative CPU history over 60 seconds, ending at 15 percent" data-history="cpu"></svg>
              <span class="value">15%</span>
            </div>
            <div class="metric trend-memory">
              <span class="metric-label">RAM</span>
              <div class="track" role="meter" aria-label="Memory used" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:42%"></div></div>
              <span class="value">42%</span>
              <span class="capacity">6.3/15.0 GiB</span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section data-variant="Usage meters" aria-label="Usage meters design" hidden>
      <div class="stage">
        <div class="product" id="oxi-meters" aria-label="Usage meters">
          <div class="window-label"><i data-lucide="terminal" aria-hidden="true"></i>oxishell</div>
          <div class="terminal"><span class="prompt">~ $</span> ▏</div>
          <div class="footer meter-footer">
            <div class="metric">
              <i class="icon-metric" data-lucide="cpu" aria-hidden="true"></i>
              <div class="meter-group">
                <div class="meter-readout"><span class="metric-label">CPU</span><span class="value">15%</span></div>
                <div class="segmented" role="img" aria-label="CPU meter: 15 percent, 2 of 12 segments lit" data-segments="2"></div>
              </div>
            </div>
            <div class="metric">
              <i class="icon-metric" data-lucide="memory-stick" aria-hidden="true"></i>
              <div class="meter-group">
                <div class="meter-readout"><span class="metric-label">RAM</span><span class="value">42%</span></div>
                <div class="segmented" role="img" aria-label="Memory meter: 42 percent, 5 of 12 segments lit" data-segments="5"></div>
              </div>
              <span class="capacity">6.3/15.0 GiB</span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section data-variant="Expand on click" aria-label="Expandable indicator design" hidden>
      <div class="stage">
        <div class="product" id="oxi-expand" aria-label="Expand on click">
          <div class="window-label"><i data-lucide="terminal" aria-hidden="true"></i>oxishell</div>
          <div class="terminal"><span class="prompt">~ $</span> ▏</div>
          <div class="detail" id="oxi-resource-detail" role="region" aria-label="Resource usage details">
            <div class="detail-heading"><strong>System resources</strong><span class="detail-time">Last 60 seconds</span></div>
            <div class="chart-label"><span class="metric-label">CPU</span><span class="value">15%</span></div>
            <svg class="detail-chart" viewBox="0 0 120 26" preserveAspectRatio="none" role="img" aria-label="Illustrative CPU usage over the past 60 seconds, on a 0 to 100 percent scale, ending at 15 percent" data-history="cpu"></svg>
            <div class="chart-label"><span class="metric-label">RAM</span><span class="value">42% <span class="capacity">· 6.3/15.0 GiB</span></span></div>
            <svg class="detail-chart" viewBox="0 0 120 26" preserveAspectRatio="none" role="img" aria-label="Illustrative memory usage over the past 60 seconds, on a 0 to 100 percent scale, ending at 42 percent" data-history="ram"></svg>
            <div class="chart-axis"><span>−60 s</span><span>0–100%</span><span>Now</span></div>
          </div>
          <div class="footer">
            <button class="product-button cursor-interaction" id="oxi-detail-toggle" type="button" aria-expanded="true" aria-controls="oxi-resource-detail">
              <i data-lucide="activity" aria-hidden="true"></i>
              <span>CPU <span class="value">15%</span></span>
              <span class="divider" aria-hidden="true">│</span>
              <span>RAM <span class="value">42%</span></span>
              <span class="capacity compact-capacity">6.3/15.0 GiB</span>
              <i data-lucide="chevron-up" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    (() => {
      const root = document.getElementById('oxi-resource-options');
      const svgNS = 'http://www.w3.org/2000/svg';
      const history = {
        cpu: [12, 16, 11, 10, 14, 18, 13, 9, 12, 22, 48, 66, 35, 18, 14, 20, 17, 12, 15, 28, 42, 21, 16, 10, 14, 18, 12, 17, 13, 15],
        ram: [35, 35, 35, 36, 36, 36, 37, 37, 37, 38, 38, 38, 38, 39, 39, 39, 40, 40, 40, 40, 40, 41, 41, 41, 41, 41, 42, 42, 42, 42]
      };
      function mark(tag, attributes) {
        const node = document.createElementNS(svgNS, tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, String(value)));
        return node;
      }
      root.querySelectorAll('[data-history]').forEach(svg => {
        const points = history[svg.dataset.history].map((value, i, all) => [2 + i * 116 / (all.length - 1), 24 - value * .22]);
        const path = points.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
        if (svg.classList.contains('detail-chart')) {
          svg.append(mark('line', {x1: 2, y1: 24, x2: 118, y2: 24, class: 'chart-grid'}));
        }
        svg.append(mark('path', {d: `${path} L118,24 L2,24 Z`, class: 'history-area'}));
        svg.append(mark('path', {d: path, class: 'history-line'}));
        const last = points[points.length - 1];
        svg.append(mark('circle', {cx: last[0], cy: last[1], r: 1.6, class: 'history-end'}));
      });
      root.querySelectorAll('[data-segments]').forEach(meter => {
        for (let i = 0; i < 12; i++) {
          const segment = document.createElement('span');
          segment.className = `segment${i < Number(meter.dataset.segments) ? ' on' : ''}`;
          meter.append(segment);
        }
      });
      const trend = root.querySelector('#oxi-trend');
      const meters = root.querySelector('#oxi-meters');
      const expand = root.querySelector('#oxi-expand');
      const detail = root.querySelector('#oxi-resource-detail');
      const toggle = root.querySelector('#oxi-detail-toggle');
      const trendStyle = {chartWidth: 82, showCapacity: true};
      const meterStyle = {showCapacity: true};
      const saved = window.openai?.widgetState?.privateContent;
      const expandStyle = {detailsOpen: typeof saved?.detailsOpen === 'boolean' ? saved.detailsOpen : true};
      function renderTrend() {
        trend.querySelector('.mini-history').style.width = `${trendStyle.chartWidth}px`;
        trend.querySelector('.capacity').hidden = !trendStyle.showCapacity;
      }
      function renderMeters() { meters.querySelector('.capacity').hidden = !meterStyle.showCapacity; }
      function renderExpand() {
        detail.hidden = !expandStyle.detailsOpen;
        toggle.setAttribute('aria-expanded', String(expandStyle.detailsOpen));
      }
      toggle.addEventListener('click', () => {
        expandStyle.detailsOpen = !expandStyle.detailsOpen;
        renderExpand();
        window.openai?.setWidgetState?.({privateContent: {detailsOpen: expandStyle.detailsOpen}})?.catch(() => {});
      });
      window.addEventListener('openai:set_globals', event => {
        const state = event.detail?.globals?.widgetState?.privateContent;
        if (typeof state?.detailsOpen === 'boolean') {
          expandStyle.detailsOpen = state.detailsOpen;
          renderExpand();
        }
      });
      renderTrend(); renderMeters(); renderExpand();
      if (globalThis.Tweak) {
        const trendTweak = new Tweak({container: trend, onChange: renderTrend});
        trendTweak.addSlider(trendStyle, 'chartWidth', {label: 'History width', min: 48, max: 110, unit: 'px'});
        trendTweak.addToggle(trendStyle, 'showCapacity', {label: 'Show memory capacity'});
        const meterTweak = new Tweak({container: meters, onChange: renderMeters});
        meterTweak.addToggle(meterStyle, 'showCapacity', {label: 'Show memory capacity'});
        const expandTweak = new Tweak({container: expand, onChange: renderExpand});
        expandTweak.addToggle(expandStyle, 'detailsOpen', {label: 'Show detail popover'});
      }
    })();
  </script>
</div>
