name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: oxishell version
      description: Output of `oxi --version`
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Display server
      description: Output of `echo $XDG_SESSION_TYPE`
      options: [wayland, x11, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `oxishell` from another terminal and paste any output.
      render: text
