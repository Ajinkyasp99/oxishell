name: Publish marketing website

on:
  push:
    branches: [main]
    paths:
      - "marketing-website/**"
      - ".github/workflows/marketing-website.yml"
      - "scripts/package-downloads.jq"
      - "tests/marketing-website.test.mjs"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test website and download badge
        run: node --test tests/marketing-website.test.mjs
      - name: Generate package download badge data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --slurp --from-file scripts/package-downloads.jq > marketing-website/downloads.json
      # Set Settings → Pages → Source to GitHub Actions before the first run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: marketing-website

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
