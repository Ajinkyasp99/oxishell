name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # A normal run takes about 4 minutes; the default limit is 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # A stalled mirror or package step must fail fast, not hold the job for hours.
        timeout-minutes: 10
        run: |
          APT="sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          # CI needs no man pages; the man-db trigger is slow on hosted runners.
          sudo rm -f /var/lib/man-db/auto-update
          $APT update
          $APT install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            xvfb xdotool dbus-x11 git python3 dpkg-dev appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --lib --bins
      - name: End-to-end tests (real GTK app under Xvfb)
        run: dbus-run-session -- xvfb-run -a cargo test --test e2e --test interactions -- --test-threads=1
        env:
          GTK_A11Y: none
      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/dev.oxishell.Oxishell.desktop
          appstreamcli validate --no-net data/dev.oxishell.Oxishell.metainfo.xml
      - name: Build .deb
        run: scripts/build-deb.sh
      - name: Benchmark (informational)
        run: dbus-run-session -- xvfb-run -a scripts/bench.sh | tee bench.txt
        env:
          GTK_A11Y: none
      - uses: actions/upload-artifact@v4
        with:
          name: oxishell-deb
          path: |
            dist/*.deb
            bench.txt
